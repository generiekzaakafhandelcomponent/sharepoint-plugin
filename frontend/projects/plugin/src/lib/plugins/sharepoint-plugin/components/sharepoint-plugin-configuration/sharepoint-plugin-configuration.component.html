<v-form
  (valueChange)="formValueChange($event)"
  *ngIf="{
    disabled: disabled$ | async,
    prefill: prefillConfiguration$ ? (prefillConfiguration$ | async) : null
  } as obs"
>
  <v-input
    name="configurationTitle"
    [title]="'configurationTitle' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [defaultValue]="obs.prefill?.configurationTitle"
    [required]="true"
    [widthPx]="350"
    placeholder="SharePoint Plugin"
  ></v-input>
  <v-input
    name="tenantId"
    [title]="'tenantId' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [defaultValue]="obs.prefill?.tenantId"
    [required]="true"
    [widthPx]="350"
  ></v-input>
  <v-input
    name="clientId"
    [title]="'clientId' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [defaultValue]="obs.prefill?.clientId"
    [required]="true"
    [widthPx]="350"
  ></v-input>
  <v-input
    name="clientSecret"
    [title]="'clientSecret' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [defaultValue]="obs.prefill?.clientSecret"
    [required]="true"
    [widthPx]="350"
    type="password"
  ></v-input>
  <v-input
    name="sharePointSiteId"
    [title]="'sharePointSiteId' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [defaultValue]="obs.prefill?.sharePointSiteId"
    [required]="true"
    [widthPx]="350"
  ></v-input>
  <v-input
    name="driveId"
    [title]="'driveId' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [defaultValue]="obs.prefill?.driveId"
    [required]="true"
    [widthPx]="350"
  ></v-input>
  <v-input
    name="baseFolderPath"
    [title]="'baseFolderPath' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [defaultValue]="obs.prefill?.baseFolderPath"
    [required]="true"
    [widthPx]="350"
  ></v-input>
</v-form>
